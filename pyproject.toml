[project]
name = "robot-preflight"
version = "0.1.0"
description = "Verify robot requirements against facility geometry before commissioning."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
robot-preflight = "robot_preflight.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["robot_preflight"]
